<html lang="uk" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family</title>

<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04050a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&family=Manrope:wght@300;400;600&family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050a;--fg:#e9edf5;--mut:#8d97ab;--amb:#ffb35c;--amb2:#ff7a1a;--cy:#7fd4ff;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.04)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:'Manrope','Heebo',system-ui,sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden}
h1,h2,h3{font-family:'Unbounded','Heebo',sans-serif;font-weight:400;line-height:1.15}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:22px}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;backdrop-filter:blur(14px);background:linear-gradient(#04050acc,#04050a00)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Unbounded','Heebo',sans-serif;font-size:14px;text-decoration:none;letter-spacing:.04em}
.logo i{width:20px;height:20px;border-radius:50%;background:#000;box-shadow:0 0 0 2px var(--amb),0 0 14px var(--amb2)}
nav{display:flex;gap:22px;font-size:13px;color:var(--mut)}
nav a{text-decoration:none;transition:color .2s}nav a:hover{color:var(--fg)}
.langs{display:flex;gap:4px}
.langs button{font-size:12px;padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);transition:.2s}
.langs button.on,.langs button:hover{color:#000;background:var(--amb);border-color:var(--amb)}
.burger{display:none;width:36px;height:36px;font-size:20px}
@media(max-width:860px){
  .burger{display:block}
  nav{position:absolute;inset:64px 0 auto 0;flex-direction:column;gap:0;background:#04050af2;padding:8px 22px 18px;display:none;border-bottom:1px solid var(--line)}
  nav.open{display:flex}nav a{padding:12px 0;font-size:15px}
}

/* hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:110px 22px 70px}
.bh{position:absolute;top:50%;left:50%;width:min(120vw,780px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.bh>*{position:absolute;border-radius:50%}
.halo{inset:17%;background:radial-gradient(circle,transparent 56%,#ffcf8a 60%,#ff8a2a 64%,rgba(255,110,20,.25) 72%,transparent 80%);filter:blur(3px)}
.core{inset:31%;background:#000;box-shadow:0 0 50px 8px rgba(255,150,50,.35),inset 0 0 40px #000}
.disk{inset:2%;background:conic-gradient(from 0deg,#fff1d6,#ffb35c,#d65a0a,#5a1f00,#d65a0a,#ffb35c,#fff1d6);
  -webkit-mask:radial-gradient(circle,transparent 30%,#000 34%,#000 58%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 34%,#000 58%,transparent 70%);
  filter:blur(1.4px) saturate(1.15);transform:rotateX(76deg);animation:spin 26s linear infinite}
.disk2{inset:2%;background:conic-gradient(from 90deg,transparent,rgba(127,212,255,.5),transparent 40%);
  -webkit-mask:radial-gradient(circle,transparent 40%,#000 44%,#000 52%,transparent 58%);mask:radial-gradient(circle,transparent 40%,#000 44%,#000 52%,transparent 58%);
  transform:rotateX(76deg);animation:spin 14s linear infinite reverse;mix-blend-mode:screen}
@keyframes spin{to{transform:rotateX(76deg) rotateZ(360deg)}}
.hero-in{position:relative;z-index:2;max-width:880px}
.kick{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--amb);margin-bottom:22px}
.hero h1{font-size:clamp(40px,9vw,92px);font-weight:600;letter-spacing:-.01em;text-shadow:0 0 40px #000,0 0 80px #000}
.hero p{margin:22px auto 34px;color:#c3cadb;font-size:clamp(16px,2.2vw,20px);text-shadow:0 0 20px #000}
.btn{display:inline-block;padding:14px 30px;border-radius:99px;background:linear-gradient(135deg,var(--amb),var(--amb2));color:#1a0b00;font-weight:600;text-decoration:none;font-size:14px;transition:transform .2s,box-shadow .2s;box-shadow:0 0 0 rgba(255,150,50,0)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(255,150,50,.4)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:64px}
.stat{padding:16px 8px;border-top:1px solid var(--line)}
.stat b{display:block;font-family:'Unbounded','Heebo',sans-serif;font-weight:300;font-size:clamp(26px,5vw,44px);color:var(--amb)}
.stat span{font-size:12px;color:var(--mut)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}

/* sections */
section{padding-block:100px;position:relative}
.sec-h{margin-bottom:46px}
.sec-h small{display:block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cy);margin-bottom:12px}
.sec-h h2{font-size:clamp(28px,5vw,48px)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(8px)}
.story p{max-width:720px;font-size:clamp(17px,2.2vw,21px);color:#cfd5e3}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}

/* timeline */
.tl{border-inline-start:1px solid var(--line);margin-inline-start:6px;padding-inline-start:30px;display:grid;gap:36px}
.ev{position:relative}
.ev::before{content:"";position:absolute;inset-inline-start:-37px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--amb);box-shadow:0 0 0 5px rgba(255,179,92,.15),0 0 18px var(--amb2)}
.ev b{font-family:'Unbounded','Heebo',sans-serif;font-weight:300;font-size:clamp(26px,4vw,38px);color:var(--amb)}
.ev p{color:#c3cadb;max-width:620px}

/* tree */
.treebox{overflow-x:auto;padding:10px 0 20px}
.treebox svg{display:block;margin-inline:auto;min-width:720px;width:100%;height:auto}
.treehint{color:var(--mut);font-size:13px;margin-bottom:14px}
.edge{fill:none;stroke:url(#eg);stroke-width:1.3;opacity:.55}
.sp{stroke:var(--cy);stroke-width:1;stroke-dasharray:3 5;opacity:.6}
.node{cursor:pointer;outline:none}
.node .halo2{fill:rgba(255,179,92,.12);transition:.3s;animation:tw 4s ease-in-out infinite}
.node .dot{fill:#fff;filter:drop-shadow(0 0 6px #ffb35c)}
.node:hover .halo2,.node:focus-visible .halo2{fill:rgba(255,179,92,.35);r:30px}
.node .nm{fill:#e9edf5;font-size:15px;font-family:'Manrope','Heebo',sans-serif;font-weight:400}
.node .yr{fill:#8d97ab;font-size:12px}
@keyframes tw{50%{opacity:.45}}

/* people + media */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{padding:22px;text-align:start;transition:transform .25s,border-color .25s;display:block;width:100%;text-decoration:none}
.card:hover{transform:translateY(-4px);border-color:rgba(255,179,92,.5)}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px;font-family:'Unbounded','Heebo',sans-serif;font-size:22px;color:#1a0b00;background:conic-gradient(var(--amb),var(--amb2),var(--cy),var(--amb));overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:16px;margin-bottom:4px}
.card span{color:var(--mut);font-size:13px}
.sub{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:40px 0 18px}
.vid{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#10162a,#1a0f08) center/cover;border:1px solid var(--line);display:grid;place-items:end start;padding:18px;text-align:start}
.vid .pl{position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;background:rgba(255,179,92,.9);display:grid;place-items:center;color:#1a0b00;font-size:22px;padding-inline-start:4px}
.vid .cap{position:relative;z-index:1;text-shadow:0 2px 12px #000}
.vid .cap b{font-weight:600;display:block}.vid .cap small{color:#cfd5e3}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.art{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:20px 22px}
.art small{color:var(--mut)}

/* contact + footer */
.contact{text-align:center}
.contact p{color:#c3cadb;max-width:560px;margin:0 auto 28px}
footer{padding:40px 22px;text-align:center;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(2,3,8,.8);backdrop-filter:blur(10px);padding:18px}
#modal.open{display:grid}
.mbox{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;padding:34px;background:#0a0d18;border:1px solid var(--line);border-radius:24px;box-shadow:0 0 80px rgba(255,150,50,.15);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.mbox h3{font-size:26px;margin-bottom:4px}
.mx{position:absolute;inset-block-start:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:18px}
.mrow{margin-top:16px;color:#c3cadb}
.mrow small{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cy);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;transition:.2s}
.chip:hover{border-color:var(--amb);color:var(--amb)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>

<canvas id="stars"></canvas>

<header>
  <div class="wrap hbar">
    <a class="logo" href="#top"><i></i><span id="logoName"></span></a>

      <a href="#media" data-i="n_media"></a>
      <a href="#contact" data-i="n_contact"></a>

  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="bh" aria-hidden="true"><div class="halo"></div><div class="core"></div><div class="disk"></div><div class="disk2"></div></div>

  </div>

  <section id="story" class="story"><div class="wrap rv">
    <div class="sec-h"><small data-i="n_story"></small><h2 data-i="story_h"></h2></div>

  </div></section>

  <section id="timeline"><div class="wrap">
    <div class="sec-h rv"><small>∞</small><h2 data-i="n_timeline"></h2></div>

  <section id="tree"><div class="wrap">

  </div></section>

  <section id="people"><div class="wrap">

    <div class="grid" id="pgrid"></div>

  <section id="media"><div class="wrap">
    <div class="sec-h rv"><small>▶</small><h2 data-i="n_media"></h2></div>
    <div class="sub" data-i="videos"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))" id="vgrid"></div>
    <div class="sub" data-i="articles"></div>
    <div style="display:grid;gap:12px" id="agrid"></div>
  </div></section>

  <section id="contact" class="contact"><div class="wrap rv">

  </div></section>
</main>

<footer data-i="footer"></footer>

<div id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>

 {year:1905,text:L("Початок: перші згадки про родину в [місто].","Начало: первые упоминания о семье в [город].","The beginning: first mentions of the family in [city].","ההתחלה: האזכורים הראשונים של המשפחה ב[עיר].")},
 {year:1941,text:L("Роки випробувань. Тут розкажіть про евакуацію, війну, втрати й порятунок.","Годы испытаний. Здесь расскажите об эвакуации, войне, потерях и спасении.","Years of trial. Tell here about evacuation, war, loss and survival.","שנות מבחן. כאן מספרים על פינוי, מלחמה, אובדן והצלה.")},
 {year:1970,text:L("Нове місце, нова глава. Переїзд, робота, діти.","Новое место, новая глава. Переезд, работа, дети.","A new place, a new chapter. Moving, work, children.","מקום חדש, פרק חדש. מעבר, עבודה, ילדים.")},
 {year:2000,text:L("Нове покоління. Сім'я розкидана по світу, але тримається разом.","Новое поколение. Семья разбросана по миру, но держится вместе.","A new generation. The family is scattered around the world, yet stays together.","דור חדש. המשפחה פזורה בעולם, אך נשארת יחד.")}
];

// id — это часть ссылки YouTube после v= (например youtube.com/watch?v=ABC123 → "ABC123")
const VIDEOS=[
 {id:"REPLACE_ME",title:L("Назва відео","Название видео","Video title","שם הסרטון"),desc:L("Короткий опис","Короткое описание","Short description","תיאור קצר")},
 {id:"REPLACE_ME",title:L("Назва відео","Название видео","Video title","שם הסרטון"),desc:L("Короткий опис","Короткое описание","Short description","תיאור קצר")}
];
const ARTICLES=[
 {url:"#",title:L("Назва статті","Название статьи","Article title","שם המאמר"),source:L("Джерело, рік","Источник, год","Source, year","מקור, שנה")},
 {url:"#",title:L("Назва статті","Название статьи","Article title","שם המאמר"),source:L("Джерело, рік","Источник, год","Source, year","מקור, שנה")}
];

/* ============================================================
   4. ДВИЖОК (обычно трогать не нужно)
   ============================================================ */
const LANGS=["uk","ru","en","he"],LBL={uk:"UK",ru:"RU",en:"EN",he:"עב"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang=pick(),RTL=false;
function pick(){
  const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))return q;
  try{const s=localStorage.getItem("lang");if(LANGS.includes(s))return s}catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  return n==="iw"?"he":LANGS.includes(n)?n:"en";
}
const g=o=>o[lang]||o.en;
const P=id=>PEOPLE.find(p=>p.id===id);
const yrs=p=>p.living?T[lang].living:`${p.born}–${p.died??""}`;

function setLang(l){
  lang=l;try{localStorage.setItem("lang",l)}catch(e){}
  history.replaceState(null,"","?lang="+l+location.hash);render();
}

function render(){
  const t=T[lang];RTL=lang==="he";
  document.documentElement.lang=lang;document.documentElement.dir=RTL?"rtl":"ltr";
  document.title=g(FAMILY)+" — "+t.kicker;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t[el.dataset.i]);
  $("#logoName").textContent=g(FAMILY);$("#heroName").textContent=g(FAMILY);
  $("#langs").innerHTML=LANGS.map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${LBL[l]}</button>`).join("");
  // stats
  const gens=new Set(PEOPLE.map(p=>p.gen)).size,minY=Math.min(...PEOPLE.map(p=>p.born));
  const st=[[gens,t.st_gen],[PEOPLE.length,t.st_ppl],[new Date().getFullYear()-minY,t.st_yrs],[VIDEOS.length+ARTICLES.length,t.st_sto]];
  $("#stats").innerHTML=st.map(([n,l])=>`<div class="stat"><b>${n}</b><span>${esc(l)}</span></div>`).join("");
  // timeline
  $("#tl").innerHTML=EVENTS.map(e=>`<div class="ev rv"><b>${e.year}</b><p>${esc(g(e.text))}</p></div>`).join("");
  buildTree();
  // people
  $("#pgrid").innerHTML=PEOPLE.map(p=>`<button class="card glass rv" data-id="${p.id}"><div class="av">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(g(p.name)[0])}</div><h3>${esc(g(p.name))}</h3><span>${esc(yrs(p))}</span></button>`).join("");
  // media
  $("#vgrid").innerHTML=VIDEOS.map((v,i)=>{
    const ok=v.id!=="REPLACE_ME";
    return `<div class="vid rv" data-v="${i}" ${ok?`style="background-image:linear-gradient(#0000,#000a),url(https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg)"`:""}>
      <div class="pl">▶</div><div class="cap"><b>${esc(g(v.title))}</b><small>${esc(ok?g(v.desc):t.video_hint)}</small></div></div>`}).join("");
  $("#agrid").innerHTML=ARTICLES.map(a=>`<a class="art glass rv" href="${esc(a.url)}" target="_blank" rel="noopener"><div><b>${esc(g(a.title))}</b><br><small>${esc(g(a.source))}</small></div><span>↗</span></a>`).join("");
  $("#mail").href="mailto:"+CONFIG.email;
  observe();
}

function buildTree(){
  const gens=[...new Set(PEOPLE.map(p=>p.gen))].sort((a,b)=>a-b);
  const rows=gens.map(n=>PEOPLE.filter(p=>p.gen===n));
  const maxN=Math.max(...rows.map(r=>r.length)),W=Math.max(760,maxN*220),RH=170,H=rows.length*RH+30,pos={};
  rows.forEach((r,ri)=>r.forEach((p,i)=>{let x=(i+1)*W/(r.length+1);if(RTL)x=W-x;pos[p.id]={x,y:50+ri*RH}}));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#7fd4ff"/></linearGradient></defs>`;
  PEOPLE.forEach(c=>c.parents.forEach(pid=>{
    const a=pos[pid],b=pos[c.id],m=(a.y+b.y)/2;
    s+=`<path class="edge" d="M${a.x} ${a.y} C${a.x} ${m},${b.x} ${m},${b.x} ${b.y}"/>`}));
  PEOPLE.forEach(p=>{if(p.spouse&&p.id<p.spouse){const a=pos[p.id],b=pos[p.spouse];if(a&&b)s+=`<line class="sp" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}});
  PEOPLE.forEach((p,i)=>{const q=pos[p.id];
    s+=`<g class="node" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(g(p.name))}" transform="translate(${q.x},${q.y})">
      <circle class="halo2" r="22" style="animation-delay:${(i*.7)%4}s"/><circle class="dot" r="6"/>
      <text class="nm" y="42" text-anchor="middle">${esc(g(p.name))}</text><text class="yr" y="60" text-anchor="middle">${esc(yrs(p))}</text></g>`});
  $("#treebox").innerHTML=s+"</svg>";
}

function openP(id){
  const p=P(id),t=T[lang];
  const kids=PEOPLE.filter(c=>c.parents.includes(id));
  const chips=ids=>`<div class="chips">${ids.map(i=>`<button class="chip" data-id="${i}">${esc(g(P(i).name))}</button>`).join("")}</div>`;
  const row=(k,v)=>v?`<div class="mrow"><small>${esc(t[k])}</small>${v}</div>`:"";
  $("#mbox").innerHTML=`<button class="mx" data-close aria-label="${esc(t.close)}">✕</button>
    <div class="av" style="width:76px;height:76px;font-size:30px">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(g(p.name)[0])}</div>
    <h3>${esc(g(p.name))}</h3><div style="color:var(--mut)">${esc(yrs(p))}</div>
    ${p.living?"":row("place",p.place?esc(g(p.place)):"")}
    <div class="mrow">${esc(g(p.bio))}</div>
    ${row("parents",p.parents.length?chips(p.parents):"")}
    ${row("spouse",p.spouse?chips([p.spouse]):"")}
    ${row("children",kids.length?chips(kids.map(k=>k.id)):"")}`;
  $("#modal").classList.add("open");
}
const closeM=()=>$("#modal").classList.remove("open");

/* события */
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]");if(l)return setLang(l.dataset.l);
  if(e.target.closest("[data-close]")||e.target===$("#modal"))return closeM();
  const n=e.target.closest("[data-id]");if(n)return openP(n.dataset.id);
  const v=e.target.closest("[data-v]");
  if(v&&!v.querySelector("iframe")){const id=VIDEOS[v.dataset.v].id;if(id!=="REPLACE_ME"){v.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`}}
  if(e.target.closest("#nav a"))$("#nav").classList.remove("open");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeM();
  if(e.key==="Enter"&&e.target.classList.contains("node"))openP(e.target.dataset.id);
});
$("#burger").onclick=()=>$("#nav").classList.toggle("open");

/* появление при прокрутке */
let io;
function observe(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}

/* звёздное небо */
(function(){
  const c=$("#stars"),x=c.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2),calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let w,h,S=[];
  function rs(){
    w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";
    S=Array.from({length:Math.round(innerWidth*innerHeight/5500)},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*.9+.1,p:Math.random()*6.28,c:Math.random()<.18?"#ffd9a8":Math.random()<.3?"#bfe6ff":"#fff"}));
  }
  function draw(t){
    x.clearRect(0,0,w,h);const sy=scrollY*dpr;
    for(const s of S){
      const y=((s.y-sy*s.z*.35)%h+h)%h,a=calm?.7:.35+.65*Math.abs(Math.sin(t/1600*s.z+s.p));
      x.globalAlpha=a;x.fillStyle=s.c;const r=s.z*1.7*dpr;x.fillRect(s.x,y,r,r);
    }
    if(!calm)requestAnimationFrame(draw);
  }
  addEventListener("resize",()=>{rs();calm&&draw(0)});rs();requestAnimationFrame(draw);
})();

render();
</script>
</body>
</html>
