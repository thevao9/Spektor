<!doctype html>
<html lang="uk" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family</title>
<!-- ПОКА САЙТ НЕ ГОТОВ: закрыт от поисковиков. Когда решите сделать его публичным — удалите следующую строку. -->
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05050c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&family=Manrope:wght@300;400;600&family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --a-rgb:139,92,246; --b-rgb:255,138,61; --c-rgb:59,130,246;   /* меняются скриптом: фиолетовый / оранжевый / синий */
  --a:rgb(var(--a-rgb)); --b:rgb(var(--b-rgb)); --c:rgb(var(--c-rgb));
  --bg:#05050c; --fg:#ecedf7; --mut:#9096ad; --line:rgba(255,255,255,.1); --glass:rgba(255,255,255,.045);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:'Manrope','Heebo',system-ui,sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(60% 45% at 12% 8%,rgba(var(--a-rgb),.24),transparent 70%),
   radial-gradient(50% 40% at 92% 28%,rgba(var(--b-rgb),.15),transparent 70%),
   radial-gradient(70% 50% at 50% 105%,rgba(var(--c-rgb),.22),transparent 70%)}
h1,h2,h3{font-family:'Unbounded','Heebo',sans-serif;font-weight:400;line-height:1.15}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:22px}
.grad{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;backdrop-filter:blur(16px);background:linear-gradient(#05050cd9,#05050c00)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Unbounded','Heebo',sans-serif;font-size:13px;text-decoration:none;letter-spacing:.04em;white-space:nowrap}
.logo i{width:20px;height:20px;border-radius:50%;background:#000;box-shadow:0 0 0 2px var(--b),0 0 14px var(--b),0 0 24px var(--a)}
nav{display:flex;gap:20px;font-size:13px;color:var(--mut)}
nav a{text-decoration:none;transition:color .2s}nav a:hover{color:var(--fg)}
.tools{display:flex;gap:12px;align-items:center}
.th{display:flex;gap:7px}
.th button{width:18px;height:18px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--line);transition:transform .2s}
.th button:hover{transform:scale(1.2)}.th button.on{border-color:#fff}
.langs{display:flex;gap:4px}
.langs button{font-size:12px;padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);transition:.2s}
.langs button.on,.langs button:hover{color:#fff;background:var(--a);border-color:var(--a)}
.burger{display:none;width:36px;height:36px;font-size:20px}
@media(max-width:980px){
  .burger{display:block}
  nav{position:absolute;inset:64px 0 auto 0;flex-direction:column;gap:0;background:#05050cf5;padding:8px 22px 18px;display:none;border-bottom:1px solid var(--line)}
  nav.open{display:flex}nav a{padding:12px 0;font-size:15px}
}
@media(max-width:600px){.logo span{display:none}}

/* hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:110px 22px 70px}
.bh{position:absolute;top:50%;left:50%;width:min(120vw,780px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.bh>*{position:absolute;border-radius:50%}
.halo{inset:17%;background:radial-gradient(circle,transparent 56%,#fff 59%,var(--b) 62%,rgba(var(--a-rgb),.4) 72%,transparent 80%);filter:blur(3px)}
.core{inset:31%;background:#000;box-shadow:0 0 60px 10px rgba(var(--a-rgb),.4),0 0 120px 20px rgba(var(--b-rgb),.18),inset 0 0 40px #000}
.disk{inset:2%;background:conic-gradient(from 0deg,#fff,var(--b),var(--a),var(--c),var(--a),var(--b),#fff);
  -webkit-mask:radial-gradient(circle,transparent 30%,#000 34%,#000 58%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 34%,#000 58%,transparent 70%);
  transform:rotateX(76deg);animation:spin 26s linear infinite;will-change:transform}
.disk2{inset:2%;background:conic-gradient(from 90deg,transparent,rgba(var(--c-rgb),.65),transparent 40%);
  -webkit-mask:radial-gradient(circle,transparent 40%,#000 44%,#000 52%,transparent 58%);mask:radial-gradient(circle,transparent 40%,#000 44%,#000 52%,transparent 58%);
  transform:rotateX(76deg);animation:spin 14s linear infinite reverse;mix-blend-mode:screen;will-change:transform}
@keyframes spin{to{transform:rotateX(76deg) rotateZ(360deg)}}
.hero-in{position:relative;z-index:2;max-width:900px}
.kick{display:inline-block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#fff;margin-bottom:24px;padding:8px 18px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);backdrop-filter:blur(8px)}
.hero h1{font-size:clamp(34px,8vw,84px);font-weight:600;letter-spacing:-.01em;filter:drop-shadow(0 0 28px rgba(0,0,0,.9))}
.hero p{margin:22px auto 34px;color:#d3d6e6;font-size:clamp(16px,2.2vw,20px);text-shadow:0 0 20px #000}
.btn{display:inline-block;padding:14px 30px;border-radius:99px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600;text-decoration:none;font-size:14px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(var(--a-rgb),.5)}
.btn.ghost{background:transparent;border:1px solid var(--line);font-weight:400}
.btn.ghost:hover{border-color:rgba(var(--a-rgb),.7);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:64px}
.stat{padding:16px 8px;border-top:1px solid var(--line)}
.stat b{display:block;font-family:'Unbounded','Heebo',sans-serif;font-weight:300;font-size:clamp(26px,5vw,44px)}
.stat span{font-size:12px;color:var(--mut)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}

/* sections */
section{padding-block:96px;position:relative}
.sec-h{margin-bottom:44px}
.sec-h small{display:block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--c);margin-bottom:12px}
.sec-h h2{font-size:clamp(28px,5vw,48px)}
.lead{max-width:760px;font-size:clamp(17px,2.2vw,21px);color:#d0d3e4}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(8px)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
/* спокойные разделы про память: без градиентов и ярких акцентов */
.quiet{background:rgba(255,255,255,.02);border-block:1px solid var(--line)}
.quiet .sec-h small{color:var(--mut)}
.quiet .btn{background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:400}
.quiet .btn:hover{box-shadow:none;border-color:rgba(255,255,255,.4)}

/* stories */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.story{padding:26px}
.story i{font-style:normal;font-family:'Unbounded','Heebo',sans-serif;font-size:28px;font-weight:300}
.story h3{font-size:18px;margin:10px 0 10px}
.story p{color:#c9cce0;font-size:15px}

/* timeline */
.tl{border-inline-start:1px solid var(--line);margin-inline-start:6px;padding-inline-start:30px;display:grid;gap:34px}
.ev{position:relative}
.ev::before{content:"";position:absolute;inset-inline-start:-37px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--b);box-shadow:0 0 0 5px rgba(var(--b-rgb),.18),0 0 18px var(--a)}
.ev b{font-family:'Unbounded','Heebo',sans-serif;font-weight:300;font-size:clamp(24px,4vw,36px)}
.ev p{color:#cdd0e2;max-width:640px}

/* tree */
.treebox{overflow-x:auto;padding:10px 0 20px}
.treebox svg{display:block;margin-inline:auto;min-width:720px;width:100%;height:auto}
.treehint{color:var(--mut);font-size:13px;margin-bottom:14px}
.edge{fill:none;stroke:url(#eg);stroke-width:1.4;opacity:.6}
.sp{stroke:var(--b);stroke-width:1;stroke-dasharray:3 5;opacity:.7}
.node{cursor:pointer;outline:none}
.node .halo2{fill:rgba(var(--a-rgb),.2);transition:.3s;animation:tw 4s ease-in-out infinite}
.node .dot{fill:#fff;filter:drop-shadow(0 0 6px var(--b))}
.node:hover .halo2,.node:focus-visible .halo2{fill:rgba(var(--b-rgb),.45);r:30px}
.node .nm{fill:#ecedf7;font-size:15px;font-family:'Manrope','Heebo',sans-serif;font-weight:400}
.node .yr{fill:#9096ad;font-size:12px}
@keyframes tw{50%{opacity:.45}}
.treenote{color:var(--mut);font-size:13px;margin-top:12px}

/* people */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{padding:22px;text-align:start;transition:transform .25s,border-color .25s;display:block;width:100%}
.card:hover{transform:translateY(-4px);border-color:rgba(var(--a-rgb),.65)}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px;font-family:'Unbounded','Heebo',sans-serif;font-size:22px;color:#fff;background:conic-gradient(var(--a),var(--b),var(--c),var(--a));overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:16px;margin-bottom:4px}
.card span{color:var(--mut);font-size:13px}

/* interviews */
.ivgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.iv{overflow:hidden}
.vid{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#12142a,#1c1226) center/cover;display:grid;place-items:center;cursor:pointer}
.vid .pl{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#111;font-size:22px;padding-inline-start:4px;transition:transform .2s}
.vid:hover .pl{transform:scale(1.08)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .hint{position:absolute;inset-block-end:12px;inset-inline:16px;font-size:12px;color:var(--mut)}
.ivb{padding:22px 24px 26px}
.ivb h3{font-size:19px}
.ivb .meta{color:var(--mut);font-size:13px;margin:4px 0 14px}
.ivb ul{padding-inline-start:18px;color:#cdd0e2;font-size:14px;margin-bottom:18px}
.ivb li{margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .btn{padding:10px 20px;font-size:13px}

/* archive */
.arbox{padding:30px;max-width:900px}
.arbox p{color:#d0d3e4;margin-bottom:14px}
.facts{font-family:'Unbounded','Heebo',sans-serif;font-weight:300;font-size:clamp(16px,2.4vw,22px);line-height:1.5;margin:6px 0 4px!important}
.src{font-size:12px;color:var(--mut)!important}
.arbox h3{font-size:16px;margin:22px 0 10px}
.arbox ol{padding-inline-start:20px;color:#cdd0e2;margin-bottom:20px}
.arbox li{margin-bottom:6px}

/* names + sources */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:400}
td:first-child{white-space:nowrap;font-weight:400}
.tbl{overflow-x:auto;padding:6px 8px}
.srcl{list-style:none;display:grid;gap:10px}
.srcl li{padding:14px 18px;color:#cdd0e2;font-size:14px}
.srcl a{text-decoration:underline;text-decoration-color:rgba(var(--b-rgb),.7);text-underline-offset:3px}

/* contact + footer */
.contact{text-align:center}
.contact p{color:#d0d3e4;max-width:560px;margin:0 auto 28px}
.contact .pv{color:var(--mut);font-size:13px;margin:26px auto 0}
footer{padding:40px 22px;text-align:center;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(3,3,9,.82);backdrop-filter:blur(10px);padding:18px}
#modal.open{display:grid}
.mbox{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;padding:34px;background:#0b0b18;border:1px solid var(--line);border-radius:24px;box-shadow:0 0 90px rgba(var(--a-rgb),.25);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.mbox h3{font-size:26px;margin-bottom:4px}
.mx{position:absolute;inset-block-start:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:18px}
.mrow{margin-top:16px;color:#cdd0e2}
.mrow small{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;transition:.2s}
.chip:hover{border-color:var(--b);color:var(--b)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header>
  <div class="wrap hbar">
    <a class="logo" href="#top"><i></i><span id="logoName"></span></a>
    <nav id="nav">
      <a href="#stories" data-i="n_stories"></a>
      <a href="#timeline" data-i="n_timeline"></a>
      <a href="#tree" data-i="n_tree"></a>
      <a href="#interviews" data-i="n_interviews"></a>
      <a href="#archive" data-i="n_archive"></a>
      <a href="#contact" data-i="n_contact"></a>
    </nav>
    <div class="tools">
      <div class="th" id="th"></div>
      <div class="langs" id="langs"></div>
      <button class="burger" id="burger" aria-label="menu">☰</button>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="bh" aria-hidden="true"><div class="halo"></div><div class="core"></div><div class="disk"></div><div class="disk2"></div></div>
    <div class="hero-in">
      <div class="kick" data-i="kicker"></div>
      <h1 class="grad" id="heroName"></h1>
      <p data-i="tagline"></p>
      <a class="btn" href="#intro" data-i="cta"></a>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <section id="intro"><div class="wrap rv">
    <div class="sec-h"><small>◎</small><h2 class="grad" data-i="intro_h"></h2></div>
    <p class="lead" data-i="intro_t"></p>
  </div></section>

  <section id="stories"><div class="wrap">
    <div class="sec-h rv"><small>✦</small><h2 class="grad" data-i="n_stories"></h2></div>
    <div class="sgrid" id="sgrid"></div>
  </div></section>

  <section id="timeline"><div class="wrap">
    <div class="sec-h rv"><small>∞</small><h2 class="grad" data-i="n_timeline"></h2></div>
    <div class="tl" id="tl"></div>
  </div></section>

  <section id="tree"><div class="wrap">
    <div class="sec-h rv"><small>✧</small><h2 class="grad" data-i="tree_h"></h2></div>
    <p class="treehint" data-i="tree_hint"></p>
    <div class="treebox glass rv" id="treebox"></div>
    <p class="treenote" data-i="tree_note"></p>
  </div></section>

  <section id="people"><div class="wrap">
    <div class="sec-h rv"><small>◉</small><h2 class="grad" data-i="people_h"></h2></div>
    <div class="grid" id="pgrid"></div>
  </div></section>

  <section id="interviews" class="quiet"><div class="wrap">
    <div class="sec-h rv"><small>▶</small><h2 data-i="iv_h"></h2></div>
    <p class="lead rv" style="margin-bottom:34px" data-i="iv_t"></p>
    <div class="ivgrid" id="ivgrid"></div>
  </div></section>

  <section id="archive" class="quiet" style="border-top:0"><div class="wrap">
    <div class="sec-h rv"><small>❖</small><h2 data-i="ar_h"></h2></div>
    <div class="arbox glass rv" id="arbox"></div>
  </div></section>

  <section id="names"><div class="wrap">
    <div class="sec-h rv"><small>Aa</small><h2 class="grad" data-i="names_h"></h2></div>
    <p class="lead rv" style="margin-bottom:26px;font-size:16px" data-i="names_t"></p>
    <div class="tbl glass rv"><table><thead><tr><th data-i="th_person"></th><th data-i="th_variants"></th></tr></thead><tbody id="ntb"></tbody></table></div>
  </div></section>

  <section id="sources" style="padding-top:0"><div class="wrap">
    <div class="sec-h rv"><small>§</small><h2 class="grad" data-i="src_h"></h2></div>
    <ul class="srcl" id="srcl"></ul>
  </div></section>

  <section id="contact" class="contact"><div class="wrap rv">
    <div class="sec-h"><small>✉</small><h2 class="grad" data-i="contact_h"></h2></div>
    <p data-i="contact_t"></p>
    <a class="btn" id="mail" data-i="contact_b"></a>
    <p class="pv" data-i="privacy"></p>
  </div></section>
</main>

<footer data-i="footer"></footer>

<div id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>

const LANGS=["uk","ru","en","he"],LBL={uk:"UK",ru:"RU",en:"EN",he:"עב"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang=pick(),RTL=false;
function pick(){
  const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))return q;
  try{const s=localStorage.getItem("lang");if(LANGS.includes(s))return s}catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  return n==="iw"?"he":LANGS.includes(n)?n:"en";
}
const g=o=>o[lang]||o.en;

/* палитра: фиолетовый / оранжевый / синий, переливается или фиксируется */
const PAL=[[139,92,246],[255,138,61],[59,130,246]];
let mode="auto";
try{const m=localStorage.getItem("pal");if(["auto","0","1","2"].includes(m))mode=m}catch(e){}
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function setVars(a,b,c){const r=document.documentElement.style;[["a",a],["b",b],["c",c]].forEach(([k,v])=>{const s=v.map(Math.round).join(",");r.setProperty("--"+k+"-rgb",s);r.setProperty("--"+k,"rgb("+s+")")})}
const mix=(x,y,t)=>x.map((v,i)=>v+(y[i]-v)*t),ease=t=>t*t*(3-2*t);
function applyPal(ts){
  if(mode==="auto"&&!calm){
    const STEP=12000,p=(ts%(STEP*3))/STEP,i=Math.floor(p)%3,q=p-Math.floor(p),f=ease(Math.min(1,Math.max(0,(q-.4)/.6)));
    setVars(mix(PAL[i],PAL[(i+1)%3],f),mix(PAL[(i+1)%3],PAL[(i+2)%3],f),mix(PAL[(i+2)%3],PAL[i],f));
  }else{const k=mode==="auto"?0:+mode;setVars(PAL[k],PAL[(k+1)%3],PAL[(k+2)%3])}
}
function setPal(m){mode=m;try{localStorage.setItem("pal",m)}catch(e){}applyPal(performance.now());drawTheme()}
function drawTheme(){
  const t=T[lang],defs=[["auto",t.th_auto,"conic-gradient(#8b5cf6,#ff8a3d,#3b82f6,#8b5cf6)"],["0",t.th_pur,"#8b5cf6"],["1",t.th_ora,"#ff8a3d"],["2",t.th_blu,"#3b82f6"]];
  $("#th").innerHTML=defs.map(([k,n,bg])=>`<button data-pal="${k}" class="${k===mode?"on":""}" title="${esc(n)}" aria-label="${esc(n)}" style="background:${bg}"></button>`).join("");
}
applyPal(performance.now());
if(!calm)setInterval(()=>{if(mode==="auto")applyPal(performance.now())},130);

function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}history.replaceState(null,"","?lang="+l+location.hash);render()}

function render(){
  const t=T[lang];RTL=lang==="he";
  document.documentElement.lang=lang;document.documentElement.dir=RTL?"rtl":"ltr";
  document.title=g(FAMILY)+" — "+t.kicker;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t[el.dataset.i]);
  $("#logoName").textContent=g(FAMILY);$("#heroName").textContent=g(FAMILY);
  $("#langs").innerHTML=LANGS.map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${LBL[l]}</button>`).join("");
  drawTheme();
  // stats
  const gens=new Set(PEOPLE.map(p=>p.gen)).size,minY=Math.min(...PEOPLE.filter(p=>p.born).map(p=>parseInt(p.born)));
  const st=[[gens,t.st_gen],[PEOPLE.length,t.st_ppl],[new Date().getFullYear()-minY,t.st_yrs],[STORIES.length+INTERVIEWS.length,t.st_sto]];
  $("#stats").innerHTML=st.map(([n,l])=>`<div class="stat"><b class="grad">${n}</b><span>${esc(l)}</span></div>`).join("");
  // stories
  $("#sgrid").innerHTML=STORIES.map((s,i)=>`<article class="story glass rv"><i class="grad">0${i+1}</i><h3>${esc(g(s.t))}</h3><p>${esc(g(s.x))}</p></article>`).join("");
  // timeline
  $("#tl").innerHTML=EVENTS.map(e=>`<div class="ev rv"><b class="grad">${esc(e.y)}</b><p>${esc(g(e.x))}</p></div>`).join("");
  buildTree();
  // people
  $("#pgrid").innerHTML=PEOPLE.map(p=>`<button class="card glass rv" data-id="${p.id}"><div class="av">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(g(p.name)[0])}</div><h3>${esc(g(p.name))}</h3><span>${esc(yrs(p))}</span></button>`).join("");
  // interviews
  $("#ivgrid").innerHTML=INTERVIEWS.map((v,i)=>{
    const p=P(v.pid),ok=!!v.yt;
    const bg=ok?`style="background-image:linear-gradient(#0000,#000a),url(https://i.ytimg.com/vi/${esc(v.yt)}/hqdefault.jpg)"`:"";
    return `<article class="iv glass rv"><div class="vid" data-v="${i}" ${bg}><div class="pl">▶</div>${ok?"":`<div class="hint">${esc(t.iv_hint)}</div>`}</div>
      <div class="ivb"><h3>${esc(g(p.name))}</h3><div class="meta">${esc(g(v.meta))}</div>
      <ul>${g(v.topics).split("|").map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="row">${ok?`<a class="btn ghost" href="https://youtu.be/${esc(v.yt)}" target="_blank" rel="noopener">${esc(t.iv_watch)} · YouTube ↗</a>`:""}<a class="btn ghost" href="${esc(jgUrl(v.vha))}" target="_blank" rel="noopener">${esc(t.iv_card)} ↗</a></div></div></article>`}).join("");
  // archive
  const num=n=>n.toLocaleString(lang);
  $("#arbox").innerHTML=`<p>${esc(t.ar_t1)}</p>
    <p class="facts">${esc(t.ar_facts.replace("{n}",num(60394)).replace("{l}","45").replace("{c}","69"))}</p>
    <p class="src">${esc(t.ar_src)}</p>
    <h3>${esc(t.ar_how_h)}</h3><ol>${t.ar_how.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    <div class="row"><a class="btn" href="https://vha.usc.edu" target="_blank" rel="noopener">vha.usc.edu ↗</a><a class="btn" href="https://www.jewishgen.org/search/" target="_blank" rel="noopener">JewishGen ↗</a></div>`;
  // names + sources
  $("#ntb").innerHTML=NAMES.map(n=>`<tr><td>${esc(typeof n.p==="string"?g(P(n.p).name):g(n.p))}</td><td>${esc(n.v)}</td></tr>`).join("");
  $("#srcl").innerHTML=SOURCES.map(s=>`<li class="glass rv">${s.u?`<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(g(s.x))}</a>`:esc(g(s.x))}</li>`).join("");
  $("#mail").href="mailto:"+CONFIG.email;
  observe();
}

function buildTree(){
  const gens=[...new Set(PEOPLE.map(p=>p.gen))].sort((a,b)=>a-b);
  const rows=gens.map(n=>PEOPLE.filter(p=>p.gen===n));
  const maxN=Math.max(...rows.map(r=>r.length)),W=Math.max(760,maxN*160),RH=170,H=rows.length*RH+30,pos={};
  rows.forEach((r,ri)=>r.forEach((p,i)=>{let x=(i+1)*W/(r.length+1);if(RTL)x=W-x;pos[p.id]={x,y:50+ri*RH}}));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--c)"/></linearGradient></defs>`;
  PEOPLE.forEach(c=>c.parents.forEach(pid=>{const a=pos[pid],b=pos[c.id];if(!a||!b)return;const m=(a.y+b.y)/2;
    s+=`<path class="edge" d="M${a.x} ${a.y} C${a.x} ${m},${b.x} ${m},${b.x} ${b.y}"/>`}));
  PEOPLE.forEach(p=>{if(p.spouse&&p.id<p.spouse){const a=pos[p.id],b=pos[p.spouse];if(a&&b)s+=`<line class="sp" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}});
  PEOPLE.forEach((p,i)=>{const q=pos[p.id],first=g(p.name).split(" ")[0];
    s+=`<g class="node" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(g(p.name))}" transform="translate(${q.x},${q.y})">
      <circle class="halo2" r="22" style="animation-delay:${(i*.7)%4}s"/><circle class="dot" r="6"/>
      <text class="nm" y="42" text-anchor="middle">${esc(first)}</text><text class="yr" y="60" text-anchor="middle">${esc(yrs(p))}</text></g>`});
  $("#treebox").innerHTML=s+"</svg>";
}

function openP(id){
  const p=P(id),t=T[lang],kids=PEOPLE.filter(c=>c.parents.includes(id));
  const chips=ids=>`<div class="chips">${ids.map(i=>`<button class="chip" data-id="${i}">${esc(g(P(i).name))}</button>`).join("")}</div>`;
  const row=(k,v)=>v?`<div class="mrow"><small>${esc(t[k])}</small>${v}</div>`:"";
  $("#mbox").innerHTML=`<button class="mx" data-close aria-label="${esc(t.close)}">✕</button>
    <div class="av" style="width:76px;height:76px;font-size:30px">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(g(p.name)[0])}</div>
    <h3>${esc(g(p.name))}</h3><div style="color:var(--mut)">${esc(yrs(p))}</div>
    ${row("place",p.place?esc(g(p.place)):"")}
    <div class="mrow">${esc(g(p.bio))}</div>
    ${row("parents",p.parents.filter(P).length?chips(p.parents.filter(P)):"")}
    ${row("spouse",p.spouse&&P(p.spouse)?chips([p.spouse]):"")}
    ${row("children",kids.length?chips(kids.map(k=>k.id)):"")}`;
  $("#modal").classList.add("open");
}
const closeM=()=>$("#modal").classList.remove("open");

document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]");if(l)return setLang(l.dataset.l);
  const pl=e.target.closest("[data-pal]");if(pl)return setPal(pl.dataset.pal);
  if(e.target.closest("[data-close]")||e.target===$("#modal"))return closeM();
  const n=e.target.closest("[data-id]");if(n)return openP(n.dataset.id);
  const v=e.target.closest("[data-v]");
  if(v&&!v.querySelector("iframe")){const id=INTERVIEWS[v.dataset.v].yt;if(id){v.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`}}
  if(e.target.closest("#nav a"))$("#nav").classList.remove("open");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeM();
  if(e.key==="Enter"&&e.target.classList.contains("node"))openP(e.target.dataset.id);
});
$("#burger").onclick=()=>$("#nav").classList.toggle("open");

let io;
function observe(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}

/* звёздное небо */
(function(){
  const c=$("#stars"),x=c.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);
  let w,h,S=[];
  function rs(){
    w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";
    S=Array.from({length:Math.round(innerWidth*innerHeight/5500)},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*.9+.1,p:Math.random()*6.28,c:Math.random()<.2?"#ffd2a8":Math.random()<.35?"#c9b8ff":"#fff"}));
  }
  function draw(t){
    x.clearRect(0,0,w,h);const sy=scrollY*dpr;
    for(const s of S){
      const y=((s.y-sy*s.z*.35)%h+h)%h,a=calm?.7:.35+.65*Math.abs(Math.sin(t/1600*s.z+s.p));
      x.globalAlpha=a;x.fillStyle=s.c;const r=s.z*1.7*dpr;x.fillRect(s.x,y,r,r);
    }
    if(!calm)requestAnimationFrame(draw);
  }
  addEventListener("resize",()=>{rs();calm&&draw(0)});rs();requestAnimationFrame(draw);
})();

render();
</script>
